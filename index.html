<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Digital CULT-ure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--mute:#9a9aa3;color-scheme:light;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font:400 .8rem/1.4 system-ui,sans-serif}
body{touch-action:none;cursor:grab}
body:active{cursor:grabbing}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.t{position:fixed;left:0;right:0;text-align:center;color:var(--mute);pointer-events:none;padding:0 1rem}
#msg{top:50%;transform:translateY(-50%)}
#credit{bottom:calc(.8rem + env(safe-area-inset-bottom,0px))}
:root{--ink:#26324f;--blue:#2f6bff;--title:"Minion 3","Minion Pro","Crimson Pro",Georgia,serif;--pix:"Pixel Operator Mono","PixelOperatorMono","VT323",ui-monospace,monospace}
@font-face{font-family:"PixelOperatorMono";src:local("Pixel Operator Mono"),url("PixelOperatorMono.ttf") format("truetype");font-display:swap}
#title{position:fixed;z-index:3;top:calc(1.2rem + env(safe-area-inset-top,0px));left:1.6rem;margin:0;font:500 clamp(1.9rem,6.4vw,3.4rem)/1.05 var(--title);letter-spacing:-.005em;color:var(--ink);pointer-events:none}
#title b{font-weight:600;color:var(--blue)}
#enter{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:.6rem .8rem;border:0;background:none;color:var(--ink);font:400 clamp(1.15rem,3.6vw,1.5rem)/1.1 var(--pix);letter-spacing:.02em;text-shadow:0 0 6px #fff,0 0 12px #fff,0 0 18px #fff;cursor:pointer;white-space:nowrap;transition:color .2s,opacity .5s}
#enter:hover{color:var(--blue)}
#enter[hidden]{display:none}
#enter.gone{opacity:0;pointer-events:none}
#title.dim{opacity:1}
#veil{position:fixed;inset:0;z-index:2;background:#fff;opacity:0;pointer-events:none}
#page{position:fixed;inset:0;z-index:4;background:#fff;display:none;overflow:auto;touch-action:auto;cursor:auto}
#page.on{display:block;animation:pin .8s ease both}
@keyframes pin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#page.on{animation:none}}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<h1 id="title">The Digital <b>CULT</b>-ure</h1>
<button id="enter" type="button" hidden>(Click to enter the cult)</button>
<div id="veil"></div>
<main id="page" aria-label="Inside the cult"></main>
<div class="t" id="msg">Loading scan…</div>
<div class="t" id="credit"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* Credit line shown at the bottom, e.g. "Cologne Cathedral by AUTHOR, CC BY 4.0" */
const CREDIT="";
const msg=document.getElementById("msg"),enterBtn=document.getElementById("enter"),veil=document.getElementById("veil"),page=document.getElementById("page"),titleEl=document.getElementById("title");document.getElementById("credit").textContent=CREDIT;
try{
const T=THREE,reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,dpr=Math.min(devicePixelRatio,2);
const r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(dpr);
r.domElement.setAttribute("role","img");r.domElement.setAttribute("aria-label","A 3D scan of Cologne Cathedral with an eye hovering in front of it, which follows your pointer");
document.body.appendChild(r.domElement);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(35,1,.1,100);
scene.add(new T.HemisphereLight(0xffffff,0xe6dfd3,.95));
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(4,9,6);scene.add(sun);
const g=new T.Group();scene.add(g);
const eye=new T.Group(),iris=new T.Group();eye.add(iris);
/* the eye is drawn as blue dots, like the cathedral scan */
const shell=new T.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}),
 eyeDots=new T.PointsMaterial({size:.02*dpr,vertexColors:true,sizeAttenuation:true}),EL=new T.Vector3(.35,.85,.55).normalize();
function dots(geo,hex,parent,x,y,z,sx,sy,sz,d){
 const m=new T.Mesh(geo,shell);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.updateMatrix();parent.add(m);
 const base=new T.Color(hex),gg=geo.index?geo.toNonIndexed():geo,p=gg.attributes.position,P=[],C=[],A=new T.Vector3(),B=new T.Vector3(),Q=new T.Vector3(),E1=new T.Vector3(),E2=new T.Vector3(),N=new T.Vector3();
 for(let i=0;i<p.count;i+=3){A.fromBufferAttribute(p,i).applyMatrix4(m.matrix);B.fromBufferAttribute(p,i+1).applyMatrix4(m.matrix);Q.fromBufferAttribute(p,i+2).applyMatrix4(m.matrix);
  E1.subVectors(B,A);E2.subVectors(Q,A);N.crossVectors(E1,E2);const area=N.length()/2;if(area<1e-8)continue;N.normalize();
  const sh=.7+.3*Math.max(0,N.dot(EL)),k=Math.floor(area*d+Math.random());
  for(let j=0;j<k;j++){let u=Math.random(),v=Math.random();if(u+v>1){u=1-u;v=1-v}const o=Math.random()*.01,w=Math.random()*.1+.95;
   P.push(A.x+E1.x*u+E2.x*v+N.x*o,A.y+E1.y*u+E2.y*v+N.y*o,A.z+E1.z*u+E2.z*v+N.z*o);
   C.push(Math.min(1,base.r*sh*w),Math.min(1,base.g*sh*w),Math.min(1,base.b*sh*w))}}
 const pg=new T.BufferGeometry();pg.setAttribute("position",new T.Float32BufferAttribute(P,3));pg.setAttribute("color",new T.Float32BufferAttribute(C,3));parent.add(new T.Points(pg,eyeDots))}
dots(new T.SphereGeometry(.3,40,20),0xbcd6ff,eye,0,0,0,1.3,.75,.35,1100);
dots(new T.TorusGeometry(.3,.014,8,64),0x1d3f91,eye,0,0,.01,1.3,.75,1,2200);
dots(new T.SphereGeometry(.17,32,16),0x2f6bff,iris,0,0,.09,1,1,.25,1600);
dots(new T.SphereGeometry(.08,24,12),0x0a1a4a,iris,0,0,.12,1,1,.25,2400);

new T.GLTFLoader().load("cathedral.glb",gltf=>{
 const model=gltf.scene,pre=new T.Group();pre.add(model);
 let main=null;model.traverse(o=>{if(!o.isMesh)return;if(o.geometry.attributes.color){o.visible=false;return}main=o});
 const tex=main.material.map,H=5.2,box=new T.Box3();
 pre.updateMatrixWorld(true);box.setFromObject(main);model.scale.setScalar(H/(box.max.y-box.min.y));
 pre.updateMatrixWorld(true);box.setFromObject(main);const c=box.getCenter(new T.Vector3());model.position.set(-c.x,-box.min.y,-c.z);
 pre.updateMatrixWorld(true);box.setFromObject(main);
 /* read the photo texture so every point gets its true colour */
 const im=tex.image,W=im.width,Hh=im.height,cv=document.createElement("canvas");cv.width=W;cv.height=Hh;
 const cx=cv.getContext("2d");cx.drawImage(im,0,0);const px=cx.getImageData(0,0,W,Hh).data;
 const pa=main.geometry.attributes.position,ua=main.geometry.attributes.uv,step=innerWidth<700?3:2,n=Math.ceil(pa.count/step),P=new Float32Array(n*3),C=new Float32Array(n*3),v=new T.Vector3();
 for(let i=0,j=0;i<pa.count;i+=step,j++){v.fromBufferAttribute(pa,i).applyMatrix4(main.matrixWorld);P[j*3]=v.x;P[j*3+1]=v.y;P[j*3+2]=v.z;
  const x=Math.min(W-1,Math.floor(ua.getX(i)*W)),y=Math.min(Hh-1,Math.floor(ua.getY(i)*Hh)),k=(y*W+x)*4;
  C[j*3]=Math.min(1,px[k]/255*1.05);C[j*3+1]=Math.min(1,px[k+1]/255*1.05);C[j*3+2]=Math.min(1,px[k+2]/255*1.05)}
 /* the mesh stays as an invisible white shell so dots behind it are hidden */
 main.material=new T.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
 g.add(model);
 const pg=new T.BufferGeometry();pg.setAttribute("position",new T.BufferAttribute(P,3));pg.setAttribute("color",new T.BufferAttribute(C,3));
 g.add(new T.Points(pg,new T.PointsMaterial({size:.016*dpr,vertexColors:true,sizeAttenuation:true})));
 /* the eye hovers in front of the west facade, between the two towers (facade faces +x) */
 eye.position.set(box.max.x+.25,box.min.y+H*.5,(box.min.z+box.max.z)/2);eye.rotation.y=Math.PI/2;eye.scale.setScalar(1.25);g.add(eye);
 msg.remove();enterBtn.hidden=false;
},undefined,()=>{msg.textContent="The scan could not load. Open this page from its web address, with cathedral.glb in the same folder."});

let baseD=13,zoom=0;
const lerp=(a,b,t)=>a+(b-a)*t;
function placeCam(){cam.position.set(0,lerp(4.6,2.6,zoom),lerp(baseD,.6,zoom));cam.lookAt(0,lerp(2.5,2.6,zoom),0)}
function size(){const w=innerWidth,h=innerHeight,a=w/h;r.setSize(w,h);cam.aspect=a;cam.updateProjectionMatrix();
 baseD=Math.max(13,12/a);placeCam()}
size();addEventListener("resize",size);
let ry=-Math.PI/2,vel=0,drag=false,lx=0,nx=0,ny=0;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let entering=false,done=false;
enterBtn.addEventListener("pointerdown",e=>e.stopPropagation());
addEventListener("pointerdown",e=>{if(entering)return;drag=true;lx=e.clientX});
addEventListener("pointermove",e=>{if(entering)return;nx=e.clientX/innerWidth*2-1;ny=e.clientY/innerHeight*2-1;if(!drag)return;const dx=e.clientX-lx;lx=e.clientX;ry+=dx*.01;vel=dx*.01});
addEventListener("pointerup",()=>drag=false);addEventListener("pointercancel",()=>drag=false);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let t0=0,ry0=0,ry1=0;
const DUR=reduce?1:2600;
enterBtn.addEventListener("click",()=>{if(entering)return;entering=true;drag=false;enterBtn.classList.add("gone");
 t0=performance.now();ry0=ry;ry1=Math.round((ry+Math.PI/2)/(Math.PI*2))*Math.PI*2-Math.PI/2;vel=0;nx=0;ny=0});
function finish(){done=true;r.domElement.style.display="none";page.classList.add("on");page.focus&&page.setAttribute("tabindex","-1");page.focus({preventScroll:true})}
(function loop(){
 if(done)return;
 if(entering){const t=Math.min(1,(performance.now()-t0)/DUR),e=ease(t);ry=lerp(ry0,ry1,Math.min(1,e*1.6));zoom=e;placeCam();
  veil.style.opacity=String(Math.max(0,(t-.5)/.45));titleEl.style.opacity=String(Math.max(.0,1-t*3)+0);
  if(t>=1){veil.style.opacity="1";finish();return}}
 else if(!drag){vel*=.95;ry+=vel+(reduce?0:.003)}
 g.rotation.y=ry;
 iris.position.x+=(cl(nx*.25*Math.cos(ry+Math.PI/2),-.14,.14)-iris.position.x)*.15;iris.position.y+=(cl(-ny*.1,-.04,.04)-iris.position.y)*.15;
 r.render(scene,cam);requestAnimationFrame(loop)})();
}catch(e){msg.textContent="Your browser could not start 3D graphics."}
</script>
</body>
</html>
