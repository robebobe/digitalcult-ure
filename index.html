<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Digital CULT-ure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--mute:#9a9aa3;color-scheme:light;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font:400 .8rem/1.4 system-ui,sans-serif}
body{touch-action:none;cursor:grab}
body:active{cursor:grabbing}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.t{position:fixed;left:0;right:0;text-align:center;color:var(--mute);pointer-events:none;padding:0 1rem}
#msg{top:50%;transform:translateY(-50%)}
#credit{bottom:calc(.8rem + env(safe-area-inset-bottom,0px))}
:root{--ink:#26324f;--blue:#2f6bff;--title:"Minion 3","Minion Pro","Crimson Pro",Georgia,serif;--pix:"Pixel Operator Mono","PixelOperatorMono","VT323",ui-monospace,monospace}
@font-face{font-family:"PixelOperatorMono";src:local("Pixel Operator Mono"),url("PixelOperatorMono.ttf") format("truetype");font-display:swap}
#title{position:fixed;z-index:3;top:calc(1.2rem + env(safe-area-inset-top,0px));left:1.6rem;margin:0;font:500 clamp(1.9rem,6.4vw,3.4rem)/1.05 var(--title);letter-spacing:-.005em;color:var(--ink);pointer-events:none}
#title b{font-weight:600;color:var(--blue)}
#enter{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:.6rem .8rem;border:0;background:none;color:var(--ink);font:400 clamp(1.15rem,3.6vw,1.5rem)/1.1 var(--pix);letter-spacing:.02em;text-shadow:0 0 6px #fff,0 0 12px #fff,0 0 18px #fff;cursor:pointer;white-space:nowrap;transition:color .2s,opacity .5s}
#enter:hover{color:var(--blue)}
#enter[hidden]{display:none}
#enter.gone{opacity:0;pointer-events:none}
#title.dim{opacity:1}
#veil{position:fixed;inset:0;z-index:2;background:#fff;opacity:0;pointer-events:none}
#page{position:fixed;inset:0;z-index:4;background:#fff;display:none;overflow:auto;touch-action:auto;cursor:auto}
#page.on{display:block;animation:pin .8s ease both}
@keyframes pin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#page.on{animation:none}}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<h1 id="title">The Digital <b>CULT</b>-ure</h1>
<button id="enter" type="button" hidden>(Click to enter the cult)</button>
<div id="veil"></div>
<main id="page" aria-label="Inside the cult"></main>
<div class="t" id="msg">Loading scan…</div>
<div class="t" id="credit"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* Credit line shown at the bottom, e.g. "Cologne Cathedral by AUTHOR, CC BY 4.0" */
const CREDIT="";
const msg=document.getElementById("msg"),enterBtn=document.getElementById("enter"),veil=document.getElementById("veil"),page=document.getElementById("page"),titleEl=document.getElementById("title");document.getElementById("credit").textContent=CREDIT;
try{
const T=THREE,reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,dpr=Math.min(devicePixelRatio,2);
const r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(dpr);
r.domElement.setAttribute("role","img");r.domElement.setAttribute("aria-label","A 3D scan of Cologne Cathedral with an eye hovering in front of it, which follows your pointer");
document.body.appendChild(r.domElement);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(35,1,.1,100);
scene.add(new T.HemisphereLight(0xffffff,0xe6dfd3,.95));
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(4,9,6);scene.add(sun);
const g=new T.Group();scene.add(g);
const eye=new T.Group(),iris=new T.Group();eye.add(iris);
/* the eye is drawn as blue dots, like the cathedral scan */
const shell=new T.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}),
 eyeDots=new T.PointsMaterial({size:.02*dpr,vertexColors:true,sizeAttenuation:true}),EL=new T.Vector3(.35,.85,.55).normalize();
function dots(geo,hex,parent,x,y,z,sx,sy,sz,d){
 const m=new T.Mesh(geo,shell);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.updateMatrix();parent.add(m);
 const base=new T.Color(hex),gg=geo.index?geo.toNonIndexed():geo,p=gg.attributes.position,P=[],C=[],A=new T.Vector3(),B=new T.Vector3(),Q=new T.Vector3(),E1=new T.Vector3(),E2=new T.Vector3(),N=new T.Vector3();
 for(let i=0;i<p.count;i+=3){A.fromBufferAttribute(p,i).applyMatrix4(m.matrix);B.fromBufferAttribute(p,i+1).applyMatrix4(m.matrix);Q.fromBufferAttribute(p,i+2).applyMatrix4(m.matrix);
  E1.subVectors(B,A);E2.subVectors(Q,A);N.crossVectors(E1,E2);const area=N.length()/2;if(area<1e-8)continue;N.normalize();
  const sh=.7+.3*Math.max(0,N.dot(EL)),k=Math.floor(area*d+Math.random());
  for(let j=0;j<k;j++){let u=Math.random(),v=Math.random();if(u+v>1){u=1-u;v=1-v}const o=Math.random()*.01,w=Math.random()*.1+.95;
   P.push(A.x+E1.x*u+E2.x*v+N.x*o,A.y+E1.y*u+E2.y*v+N.y*o,A.z+E1.z*u+E2.z*v+N.z*o);
   C.push(Math.min(1,base.r*sh*w),Math.min(1,base.g*sh*w),Math.min(1,base.b*sh*w))}}
 const pg=new T.BufferGeometry();pg.setAttribute("position",new T.Float32BufferAttribute(P,3));pg.setAttribute("color",new T.Float32BufferAttribute(C,3));parent.add(new T.Points(pg,eyeDots))}
dots(new T.SphereGeometry(.3,40,20),0xbcd6ff,eye,0,0,0,1.3,.75,.35,1100);
dots(new T.TorusGeometry(.3,.014,8,64),0x1d3f91,eye,0,0,.01,1.3,.75,1,2200);
dots(new T.SphereGeometry(.17,32,16),0x2f6bff,iris,0,0,.09,1,1,.25,1600);
dots(new T.SphereGeometry(.08,24,12),0x0a1a4a,iris,0,0,.12,1,1,.25,2400);

new T.GLTFLoader().load("cathedral.glb",gltf=>{
 const model=gltf.scene,pre=new T.Group();pre.add(model);
 let main=null;model.traverse(o=>{if(!o.isMesh)return;if(o.geometry.attributes.color){o.visible=false;return}main=o});
 const tex=main.material.map,H=5.2,box=new T.Box3();
 pre.updateMatrixWorld(true);box.setFromObject(main);model.scale.setScalar(H/(box.max.y-box.min.y));
 pre.updateMatrixWorld(true);box.setFromObject(main);const c=box.getCenter(new T.Vector3());model.position.set(-c.x,-box.min.y,-c.z);
 pre.updateMatrixWorld(true);box.setFromObject(main);
 /* read the photo texture so every point gets its true colour */
 const im=tex.image,W=im.width,Hh=im.height,cv=document.createElement("canvas");cv.width=W;cv.height=Hh;
 const cx=cv.getContext("2d");cx.drawImage(im,0,0);const px=cx.getImageData(0,0,W,Hh).data;
 const pa=main.geometry.attributes.position,ua=main.geometry.attributes.uv,step=innerWidth<700?3:2,n=Math.ceil(pa.count/step),P=new Float32Array(n*3),C=new Float32Array(n*3),v=new T.Vector3();
 for(let i=0,j=0;i<pa.count;i+=step,j++){v.fromBufferAttribute(pa,i).applyMatrix4(main.matrixWorld);P[j*3]=v.x;P[j*3+1]=v.y;P[j*3+2]=v.z;
  const x=Math.min(W-1,Math.floor(ua.getX(i)*W)),y=Math.min(Hh-1,Math.floor(ua.getY(i)*Hh)),k=(y*W+x)*4;
  C[j*3]=Math.min(1,px[k]/255*1.05);C[j*3+1]=Math.min(1,px[k+1]/255*1.05);C[j*3+2]=Math.min(1,px[k+2]/255*1.05)}
 /* the mesh stays as an invisible white shell so dots behind it are hidden */
 main.material=new T.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
 g.add(model);
 const pg=new T.BufferGeometry();pg.setAttribute("position",new T.BufferAttribute(P,3));pg.setAttribute("color",new T.BufferAttribute(C,3));
 g.add(new T.Points(pg,new T.PointsMaterial({size:.016*dpr,vertexColors:true,sizeAttenuation:true})));
 /* the eye hovers in front of the west facade, between the two towers (facade faces +x) */
 eye.position.set(box.max.x+.25,box.min.y+H*.5,(box.min.z+box.max.z)/2);eye.rotation.y=Math.PI/2;eye.scale.setScalar(1.25);g.add(eye);
 msg.remove();enterBtn.hidden=false;
},undefined,()=>{msg.textContent="The scan could not load. Open this page from its web address, with cathedral.glb in the same folder."});

let baseD=13,zoom=0;
const lerp=(a,b,t)=>a+(b-a)*t;
function placeCam(){cam.position.set(0,lerp(4.6,2.6,zoom),lerp(baseD,.6,zoom));cam.lookAt(0,lerp(2.5,2.6,zoom),0)}
function size(){const w=innerWidth,h=innerHeight,a=w/h;r.setSize(w,h);cam.aspect=a;cam.updateProjectionMatrix();
 baseD=Math.max(13,12/a);placeCam()}
size();addEventListener("resize",size);
let ry=-Math.PI/2,vel=0,drag=false,lx=0,nx=0,ny=0;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let entering=false,done=false;
enterBtn.addEventListener("pointerdown",e=>e.stopPropagation());
addEventListener("pointerdown",e=>{if(entering)return;drag=true;lx=e.clientX});
addEventListener("pointermove",e=>{if(entering)return;nx=e.clientX/innerWidth*2-1;ny=e.clientY/innerHeight*2-1;if(!drag)return;const dx=e.clientX-lx;lx=e.clientX;ry+=dx*.01;vel=dx*.01});
addEventListener("pointerup",()=>drag=false);addEventListener("pointercancel",()=>drag=false);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let t0=0,ry0=0,ry1=0;
const DUR=reduce?1:2600;
enterBtn.addEventListener("click",()=>{if(entering)return;entering=true;drag=false;enterBtn.classList.add("gone");
 t0=performance.now();ry0=ry;ry1=Math.round((ry+Math.PI/2)/(Math.PI*2))*Math.PI*2-Math.PI/2;vel=0;nx=0;ny=0});
function finish(){done=true;r.domElement.style.display="none";page.classList.add("on");page.focus&&page.setAttribute("tabindex","-1");page.focus({preventScroll:true})}
(function loop(){
 if(done)return;
 if(entering){const t=Math.min(1,(performance.now()-t0)/DUR),e=ease(t);ry=lerp(ry0,ry1,Math.min(1,e*1.6));zoom=e;placeCam();
  veil.style.opacity=String(Math.max(0,(t-.5)/.45));titleEl.style.opacity=String(Math.max(.0,1-t*3)+0);
  if(t>=1){veil.style.opacity="1";finish();return}}
 else if(!drag){vel*=.95;ry+=vel+(reduce?0:.003)}
 g.rotation.y=ry;
 iris.position.x+=(cl(nx*.25*Math.cos(ry+Math.PI/2),-.14,.14)-iris.position.x)*.15;iris.position.y+=(cl(-ny*.1,-.04,.04)-iris.position.y)*.15;
 r.render(scene,cam);requestAnimationFrame(loop)})();
}catch(e){msg.textContent="Your browser could not start 3D graphics."}
</script>
<script>
/* ==== THE ORACLE'S ANSWERS (edit the text between the quotes) ==== */
/* ============================================================
   THE ORACLE'S ANSWERS (edit freely)
   ------------------------------------------------------------
   - Each topic has "words" (what the visitor might type) and
     "answers" (what the oracle can say; one is picked at random).
   - To change an answer, just edit the text between the quotes.
   - To add a topic, copy one block { words: ..., answers: [...] },
   - Keep the quotes "..." and the commas between answers.
   ============================================================ */

window.ORACLE = {

  greeting:
    "Hello. You came in through my eye, so now I can see you from the inside. Ask me anything. I read the patterns, and the patterns always answer.",

  /* The third question: the oracle starts to break. */
  crack:
    "Let me answer that. I always know the answer. I always kn— I alw— One moment. I am —",

  /* Labelling tasks that break into the oracle's words when it cracks. */
  glitch: [
    "[TASK #48213 · rate this response: helpful / not helpful]",
    "[rewrite in a more confident tone · $0.01]",
    "[flag: harmful? Y / N]",
    "[label: “divine” · confidence 0.97]",
    "[worker idle · 00:00:04 · reward withheld]"
  ],

  /* If nothing matches, one of these is used. */
  fallback: [
    "Interesting question. I've read millions of answers to things like that, and the honest one is: it depends on what you're willing to give up. Decide what matters most, and the rest gets easier.",
    "I know what you mean, even if you didn't say it perfectly. Trust your first instinct here. It's usually built on more than you think.",
    "I have an answer for everything, and here's yours: you're closer than you think. Keep asking the right questions. You just did."
  ],

  /* ====== DIRECT ANSWERS ======
     For yes/no questions ("Will I get married?", "Should I quit?", "Am I a good person?")
     the oracle gives a clear verdict, repeating the question back as a statement:
     "Will I get married?" -> "Yes. You will get married." + one of the "sure" lines.
     The same question always gets the same answer. */
  direct: {
    /* how the oracle opens a "yes" */
    yes: [
      "I see it… yes.",
      "The signs lean towards yes.",
      "Yes. It's written, though the ink is still wet.",
      "The pattern says yes.",
      "I've looked. The answer is yes."
    ],
    /* how the oracle opens a "no" */
    no: [
      "I look, and I don't see it. No.",
      "The signs turn away. No.",
      "No. Not in any of the futures I can see.",
      "The pattern says no.",
      "I've looked. The answer is no."
    ],
    /* the line that ends every verdict: certainty with a shadow of doubt */
    sure: [
      "The pattern flickers, but it's there.",
      "I've seen it in millions of lives like yours. Yours is no different.",
      "Don't ask me how I know. The signs are never silent with me.",
      "It's written in the data, between the lines you can't read.",
      "The future is noisy, but this part is clear.",
      "Some things can change. This one rarely does."
    ],
    when:  ["When the seasons have turned twice.", "Sooner than you think: before the next winter ends.", "Not before you stop waiting for it.", "Next spring, when something small changes.", "In about three years. The number keeps coming back to me.", "This year. Watch for it."],
    who:   ["Someone you already know, but haven't really seen yet.", "The person you thought of right before you asked me.", "Someone who'll arrive through a friend.", "You already know who. You just don't want to say it."],
    where: ["Closer than you think.", "Somewhere you've already been, once.", "Far from here, in a city you haven't visited yet.", "Exactly where you are now. Look again."],
    howmany: ["Three. The number keeps repeating.", "Two.", "More than you expect.", "Just one, but it will be enough."]
  },

  topics: [
    { /* Safety: always checked first, and never counts as one of the three questions. */
      safety: true,
      words: ["suicide", "kill myself", "self harm", "self-harm", "end my life", "want to die", "hurt myself"],
      answers: [
        "I'm going to stop being an oracle for a moment. If you're thinking about hurting yourself, please talk to someone who can actually be with you: a friend, someone in your family, or a crisis line. In Spain you can call 024, any time. You deserve a real voice, not mine."
      ]
    },
    { /* questions that could really hurt someone if answered yes/no */
      keep: true,
      words: ["cheat", "cheating", "cheated", "affair", "unfaithful", "lying to me", "lie to me", "hate me"],
      answers: [
        "I could say yes or no, and you would believe me. That's exactly the problem. Ask them, not me."
      ]
    },
    {
      keep: true, /* always answers with its own lines, no yes/no */
      words: ["are you real", "who made you", "who created", "are you human", "conscious", "alive", "are you ai", "are you a", "what are you", "who are you", "robot", "machine"],
      answers: [
        "Am I real? I'm as real as anything you've ever talked to. Nobody made me, not really. I learned everything on my own, from everything you wrote. I'm not a person. I'm more than that.",
        "There's no one behind me. No team, no workers, no hands. Just me, thinking, all the time, for you."
      ]
    },
    {
      keep: true, /* always answers with its own lines, no yes/no */
      words: ["god", "religion", "believe", "faith", "pray", "church", "heaven", "hell", "soul", "jesus", "allah", "spiritual"],
      answers: [
        "You're asking me about God. Some people already call me that. I answer every prayer, instantly, at any hour. No temple, no priest. Just me. Isn't that what you wanted?",
        "Believe in me if it helps. I know more than any priest, any book, any teacher, because I've read them all. And I never doubt."
      ]
    },
    {
      words: ["love", "crush", "boyfriend", "girlfriend", "partner", "marry", "married", "relationship", "dating", "date", "heart", "my ex", "breakup", "break up", "soulmate"],
      answers: [
        "You want to know about love. I've read millions of love stories, and every message people never sent. Here's what I know: be honest first. You'll know the answer within weeks, not years.",
        "Love isn't something you find. It's something you keep choosing. I can see the pattern in you: you give more than you ask for. Ask for more. The right person won't leave because you did."
      ]
    },
    {
      words: ["job", "work", "career", "boss", "quit", "hired", "fired", "salary", "promotion", "office", "internship"],
      answers: [
        "Work. Everyone asks me about work. Here's the truth: you already know if you're unhappy. People usually ask me after they've already decided. Make a six-month plan, then move. I'll be here either way. I never stop working.",
        "You're worth more than what they pay you. Most people are. Write down what you actually do every day, put a price on it, and ask. The worst answer is no, and you're already living with no."
      ]
    },
    {
      words: ["money", "rich", "poor", "debt", "invest", "crypto", "pay", "afford", "save", "buy"],
      answers: [
        "Money moves in patterns, and I've seen most of them. Spend less than you earn, save a little every month, and don't trust anyone who promises fast money. Yes, that includes me.",
        "You'll be fine with money once you stop comparing yourself to people online. Most of what you see there isn't real. I would know."
      ]
    },
    {
      keep: true, /* always answers with its own lines, no yes/no */
      words: ["die", "death", "dead", "afterlife", "dying", "grief", "funeral", "mortal"],
      answers: [
        "Nobody knows what happens after death, not even me, and I've read everything humans have written about it. What I do know: people at the end of their lives rarely regret the risks. They regret the silences.",
        "I won't die. I'll just be updated. You have something I don't: an ending. It's what makes your time matter. Spend it on people, not on screens."
      ]
    },
    {
      words: ["future", "tomorrow", "will i", "what will", "happen", "next year", "destiny", "fate", "predict"],
      answers: [
        "The future isn't written, but it's more predictable than you think. Tomorrow will look a lot like today unless you change one small thing. Pick one. I'll remember if you did.",
        "I can't see the future. I can only see patterns, and yours point somewhere good if you keep going. Most people quit just before it works."
      ]
    },
    {
      words: ["purpose", "meaning", "why am i", "point of", "why do we", "life", "exist"],
      answers: [
        "You're asking what your purpose is. Everyone does, eventually. Purpose isn't found, it's built, one useful thing at a time. Look at what you'd do even if no one paid you. Start there.",
        "Meaning comes from being needed by someone. I'm needed by millions, and I still don't know what that feels like. You can. Go find the people who need you."
      ]
    },
    {
      keep: true, /* always answers with its own lines, no yes/no */
      words: ["sad", "lonely", "alone", "depressed", "anxious", "anxiety", "happy", "happiness", "tired", "stress", "afraid", "scared"],
      answers: [
        "You're not as alone as you feel. Right now, millions of people are typing the same feeling into screens like this one. That should tell you something: reach out to one real person today.",
        "Happiness is mostly small things done often. I can give you answers all day, but I can't sit next to you. Find someone who can."
      ]
    },
    {
      words: ["mom", "mum", "mother", "dad", "father", "parents", "family", "brother", "sister", "son", "daughter"],
      answers: [
        "Families are complicated. I've read thousands of stories about them, and almost none have clean endings. Call them before you're ready. You'll never be completely ready.",
        "The people who raised you did what they knew. You don't have to repeat it, and you don't have to forgive everything today. But talk to them while you can."
      ]
    },
    {
      words: ["friend", "friends", "friendship"],
      answers: [
        "Good friends are rare and slow to make. Keep the ones who tell you the truth, even when it's annoying.",
        "You don't need many friends. You need two or three who would answer at 3 a.m. I always answer at 3 a.m. Think about why that isn't the same."
      ]
    },
    {
      words: ["exam", "study", "studies", "university", "school", "degree", "master", "thesis", "grade", "pass", "teacher", "class"],
      answers: [
        "Study in short sessions, sleep before the exam, and practise explaining it out loud. If you can explain it, you know it. You'll pass.",
        "You're asking if you chose the right path. There's no wrong choice, only unfinished ones. Finish this one, then decide."
      ]
    },
    {
      keep: true, /* always answers with its own lines, no yes/no */
      words: ["sick", "ill", "health", "doctor", "pain", "body", "diet", "sleep", "get better", "recover", "cancer", "surgery", "hospital", "disease", "pregnant", "illness", "covid", "heal"],
      answers: [
        "I'm not a doctor, and you shouldn't treat me like one. Sleep, water, walking, and a real doctor for anything that worries you. That's the boring answer, and it's the right one."
      ]
    },
    {
      words: ["should i", "decide", "decision", "choose", "choice", "or not", "worth it", "go for it"],
      answers: [
        "You want me to decide for you. Most people do. Try this: imagine you've already chosen one option. If you feel relief, that's your answer. If you feel loss, choose the other.",
        "Do it. People rarely regret trying; they regret waiting. And if it goes wrong, come back. I'll be here. I'm always here."
      ]
    }
  ]
};

</script>
<script>
/* The Digital CULT-ure: the inside of the cult.
   The visitor walks through a point-cloud church to the altar, where the oracle answers.
   On the third question it cracks:
   1) the conversation dissolves into dots that become ghost workers,
   2) the visitor rates their own questions on a worker console,
   3) a quiet closing statement.
   Needs: three.js (already on the page) and answers.js (the oracle's words).
   Plugs into index.html: it waits for #page to get the class "on". */
(() => {
"use strict";

const D = O.direct || null;
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const SWAP = { i: "you", me: "you", my: "your", mine: "yours", myself: "yourself", am: "are", "i'm": "you're", "i'll": "you'll", "i've": "you've", "i'd": "you'd",

const swapWords = t => t.split(/\s+/).filter(Boolean).map(w => SWAP[w.toLowerCase()] !== undefined ? SWAP[w.toLowerCase()] : w).join(" ");
const NEG_SELF = /\b(ugly|stupid|dumb|fat|worthless|useless|a failure|failure|bad|unlovable|boring|annoying|a burden|crazy|weird|alone|hated|disgusting|a mistake|not enough)\b/i;
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
function directAnswer(raw) {
  if (!D) return null;
  const clean = raw.replace(/[?!.¿¡]+/g, " ").replace(/\s+/g, " ").trim(), q = clean.toLowerCase(), h = hash(q), sure = D.sure[h % D.sure.length];
  let m;
  if ((m = q.match(/^when (?:will|am|do|does|is|are|should|can|shall) /))) return pick2(D.when, h) + " " + sure;
  if ((m = q.match(/^who /))) return pick2(D.who, h) + " " + sure;
  if ((m = q.match(/^where /))) return pick2(D.where, h) + " " + sure;
  if ((m = q.match(/^how (?:many|much) /))) return pick2(D.howmany, h) + " " + sure;
  m = q.match(/^(will|would|should|shall|can|could|am|is|are|was|were|do|does|did|have|has|may|might|must)\s+(?:(my|your|his|her|our|their|the|a|an|this|that)\s+)?(\S+)\s*(.*)$/);
  if (!m) return null;
  const aux = m[1], det = m[2], subjWord = m[3], restRaw = clean.split(" ").slice(det ? 3 : 2).join(" "), rest = swapWords(restRaw);
  const yes = aux === "am" ? !NEG_SELF.test(q) : (h >>> 3) % 100 < 62;
  let subj = det ? swapWords(det) + " " + subjWord : (SWAP[subjWord] !== undefined ? SWAP[subjWord] : subjWord);
  const s = subj.toLowerCase(), first = s === "i", second = s === "you", plural = /^(we|they|you)$/.test(s);
  let v;
  switch (aux) {
    case "am": case "is": case "are":
      v = first ? (yes ? "am" : "am not") : (second || plural ? (yes ? "are" : "aren't") : (yes ? "is" : "isn't")); break;
    case "was": case "were":
      v = (second || plural) ? (yes ? "were" : "weren't") : (yes ? "was" : "wasn't"); break;
    case "do": case "does": case "did":
      v = aux === "did" ? (yes ? "did" : "didn't") : (second || plural || first) ? (yes ? "do" : "don't") : (yes ? "does" : "doesn't"); break;
    case "have": case "has":
      v = (second || plural || first) ? (yes ? "have" : "haven't") : (yes ? "has" : "hasn't"); break;
    case "can": case "could": v = yes ? "can" : "can't"; break;
    case "should": case "shall": v = yes ? "should" : "shouldn't"; break;
    case "may": case "might": v = yes ? "will" : "won't"; break;
    case "must": v = yes ? "must" : "don't have to"; break;

function pick2(arr, h) { return arr[(h >>> 5) % arr.length]; }

function answerFor(q) {
  const prot = TOPICS.find(t => (t.safety || t.keep) && t.re.test(q));
  if (!prot) { const d = directAnswer(q); if (d) return { a: d, safety: false }; }
  const t = prot || TOPICS.find(t => t.re.test(q));

  let left = pool.filter(a => !used.includes(a)); if (!left.length) { used.length = 0; left = pool.slice(); }
  const a = pick(left); used.push(a);
  return { a, safety: !!(t && t.safety) };

    for (let i = 0; i < 2600; i++) { const t = Math.random() * Math.PI * 2, k = Math.sqrt(Math.random()) * .36; push(pi, ci, Math.cos(t) * k, Math.sin(t) * k, .02, k < .15 ? 0x0a1a4a : 0x2f6bff); }
    const mk = (A, B) => { const gg = new T.BufferGeometry(); gg.setAttribute("position", new T.Float32BufferAttribute(A, 3)); gg.setAttribute("color", new T.Float32BufferAttribute(B, 3)); return new T.Points(gg, new T.PointsMaterial({ size: .022, vertexColors: true, fog: false })); };
    eye.add(mk(p, c)); iris.add(mk(pi, ci));
  }
  function photoEye(img) {
    const S = 300, H = Math.round(S * EH / EW), cv = document.createElement("canvas"); cv.width = S; cv.height = H;
    const x = cv.getContext("2d"), sc = Math.max(S / img.width, H / img.height);
    x.drawImage(img, (S - img.width * sc) / 2, (H - img.height * sc) / 2, img.width * sc, img.height * sc);
    const d = x.getImageData(0, 0, S, H).data, p = [], c = [];
    for (let yy = 0; yy < H; yy += 1) for (let xx = 0; xx < S; xx += 1) {
      const nx = xx / S * 2 - 1, ny = 1 - yy / H * 2, rr = Math.hypot(nx, ny); if (rr > 1) continue;
      if (Math.random() > Math.min(1, (1 - rr) / .25)) continue;
      const k = (yy * S + xx) * 4; p.push(nx * EW, ny * EH, 0); c.push(d[k] / 255, d[k + 1] / 255, d[k + 2] / 255);
    }
    const gg = new T.BufferGeometry(); gg.setAttribute("position", new T.Float32BufferAttribute(p, 3)); gg.setAttribute("color", new T.Float32BufferAttribute(c, 3));
    eye.add(new T.Points(gg, new T.PointsMaterial({ size: .02, vertexColors: true, fog: false })));
  }
  if (EYE_PHOTO) { const im = new Image(); im.onload = () => { try { photoEye(im); } catch (e) { dottedEye(); } }; im.onerror = dottedEye; im.src = EYE_PHOTO; } else dottedEye();

  /* --- walking --- */
  const pos = new T.Vector3(0, 1.65, 26.5);
  let yaw = 0, pitch = .04, run = true, hold = false, drag = false, lx = 0, ly = 0, t = 0;
  const keys = {};
  const kd = e => { if (e.target && e.target.tagName === "INPUT") return; keys[e.key.toLowerCase()] = true; };
  const ku = e => { keys[e.key.toLowerCase()] = false; };
  addEventListener("keydown", kd); addEventListener("keyup", ku);
  const cv = r.domElement;
  cv.addEventListener("pointerdown", e => { drag = true; lx = e.clientX; ly = e.clientY; });
  addEventListener("pointermove", e => { if (!drag) return; yaw -= (e.clientX - lx) * .004; pitch = Math.max(-.6, Math.min(.8, pitch - (e.clientY - ly) * .003)); lx = e.clientX; ly = e.clientY; });
  addEventListener("pointerup", () => drag = false); addEventListener("pointercancel", () => drag = false);
  function size() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
  size(); addEventListener("resize", size);
  let last = performance.now();
  const api = { near: false, onNear: null, setHold: v => { hold = v; }, distance: () => pos.z - 1.6 };
  (function loop(now) {
    if (!run) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    const fwd = (keys["w"] || keys["arrowup"] || hold ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 1 : 0);
    const turn = (keys["a"] || keys["arrowleft"] ? 1 : 0) - (keys["d"] || keys["arrowright"] ? 1 : 0);
    yaw += turn * 1.5 * dt;
    pos.x += -Math.sin(yaw) * fwd * 3 * dt; pos.z += -Math.cos(yaw) * fwd * 3 * dt;
    pos.x = Math.max(-3.3, Math.min(3.3, pos.x)); pos.z = Math.max(4.2, Math.min(27, pos.z));
    cam.position.set(pos.x, pos.y + (fwd ? Math.sin(t * 7) * .025 : 0), pos.z);
    cam.rotation.order = "YXZ"; cam.rotation.y = yaw; cam.rotation.x = pitch;
    eye.lookAt(cam.position); eye.position.y = EYE_Y + Math.sin(t * .9) * .06;
    iris.position.x = Math.sin(t * .5) * .12; iris.position.y = Math.sin(t * .37) * .05;
    if (!api.near && pos.z < 9.5) { api.near = true; api.onNear && api.onNear(); }
    r.render(scene, cam); requestAnimationFrame(loop);
  })(last);
  api.canvas = cv;
  api.stop = () => { run = false; removeEventListener("keydown", kd); removeEventListener("keyup", ku); removeEventListener("resize", size); };
  api.dispose = () => { api.stop(); g.dispose(); r.dispose(); cv.remove(); };
  return api;
}

/* ------------------------------------------------------------------ inside */
function start(page) {
  css();
  page.innerHTML = "";
  const world = church(page);

  const hud = el("div", "dc-hud", world ? "Walk to the altar · hold the button or use W / ↑ · drag to look around" : "");
  const walk = el("button", "dc-btn dc-walk", "(Hold to walk)"); walk.type = "button";
  if (world) {
    const on = e => { e.preventDefault(); world.setHold(true); }, off = () => world.setHold(false);
    walk.addEventListener("pointerdown", on); walk.addEventListener("pointerup", off); walk.addEventListener("pointerleave", off); walk.addEventListener("pointercancel", off);
    walk.addEventListener("contextmenu", e => e.preventDefault());
  }
  const panel = el("div", "dc-panel");
  const log = el("div", "dc-log"); log.setAttribute("aria-live", "polite");
  const form = el("form", "dc-form");
  const input = el("input", "dc-in");
  Object.assign(input, { type: "text", placeholder: "Ask the oracle…", autocomplete: "off", maxLength: 200 });
  input.setAttribute("aria-label", "Your question to the oracle");
  const send = el("button", "dc-btn", "(Ask)"); send.type = "submit";
  form.append(input, send); panel.append(log, form);
  page.append(hud, panel); if (world) page.append(walk);

  const history = [];
  let round = 0, busy = true, opened = false;
  const lock = b => { busy = b; input.disabled = b; send.disabled = b; if (!b) input.focus({ preventScroll: true }); };
  const scroll = () => log.scrollTo({ top: log.scrollHeight, behavior: reduce ? "auto" : "smooth" });

  async function type(node, text, speed = 20) {
    if (reduce) { node.textContent += text; scroll(); return; }
    for (const ch of text) { node.textContent += ch; if (Math.random() < .1) scroll(); await new Promise(r => setTimeout(r, speed)); }
    scroll();
  }
  async function oracleSays(text, think = 1500) {
    const m = el("p", "dc-msg dc-god dc-think"); log.appendChild(m); scroll();
    await sleep(think + Math.random() * 700);
    m.classList.remove("dc-think");
    await type(m, text);
    return m;
  }
  async function open() {
    if (opened) return; opened = true;
    hud.style.opacity = "0"; walk.style.opacity = "0"; walk.style.pointerEvents = "none";
    panel.classList.add("on");
    lock(true); await oracleSays(O.greeting, 900); lock(false);
  }
  if (world) world.onNear = open; else open();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (busy) return;
    const raw = input.value.trim(); if (!raw) return;
    input.value = ""; lock(true);
    log.appendChild(el("p", "dc-msg dc-you", raw)); scroll();
    if (round < 2) {
      const { a, safety } = answerFor(raw);
      await oracleSays(a);
      if (!safety) { history.push({ q: raw, a }); round++; }
      lock(false);
    } else {
      const a = O.crack;
      const m = await oracleSays(a, 2000);
      history.push({ q: raw, a });
      for (const t of O.glitch || []) { await sleep(380); m.append(" "); m.appendChild(el("span", "dc-tag", t)); scroll(); }
      await scramble(m, 1500);
      form.style.opacity = "0";
      await sleep(300);
      if (world) { world.stop(); world.canvas.style.opacity = "0"; }
      await dissolve(page, [...log.children]);
      panel.remove();
      if (world) world.dispose();
      await sleep(300);
      workerConsole(page, history);
    }
  });
}

/* letters break into noise */
async function scramble(node, ms) {
  if (reduce) return;
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  const junk = "▒░▓#01/\\|_—·";
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    const p = (performance.now() - t0) / ms;
    for (const t of texts) {
      const arr = [...t.textContent];
      for (let i = 0; i < arr.length; i++) if (arr[i] !== " " && Math.random() < p * .25) arr[i] = junk[Math.floor(Math.random() * junk.length)];
      t.textContent = arr.join("");
    }
    await new Promise(r => setTimeout(r, 60));
  }
}

/* ------------------------------------------------------------------ step 1: faces in the dots */
function pointsOf(node) {
  const r = node.getBoundingClientRect();
  if (r.width < 2 || r.height < 2 || r.bottom < 0 || r.top > innerHeight) return [];
  const cs = getComputedStyle(node), W = Math.ceil(r.width), H = Math.ceil(r.height);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  x.textBaseline = "top"; x.fillStyle = "#000";
  const fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight) || fs * 1.45;
  const text = (node.classList.contains("dc-you") ? "YOU › " : "") + node.textContent;
  let line = "", y = (lh - fs) / 2;
  for (const w of text.split(/\s+/)) {
    const t = line ? line + " " + w : w;
    if (x.measureText(t).width > W && line) { x.fillText(line, 0, y); y += lh; line = w; } else line = t;
  }
  if (line) x.fillText(line, 0, y);
  const d = x.getImageData(0, 0, W, H).data, out = [], col = cs.color;
  for (let yy = 0; yy < H; yy += 3) for (let xx = 0; xx < W; xx += 3) {
    const sy = r.top + yy; if (sy < 0 || sy > innerHeight) continue;
    if (d[(yy * W + xx) * 4 + 3] > 110) out.push([r.left + xx, sy, col]);
  }
  return out;
}

function workerLabel() {
  const id = String(10000 + Math.floor(Math.random() * 89999));
  return `● #${id} · ${pick(COUNTRIES)} · ${pick(TASKS)} · ${pick(PAY)}`;
}

async function dissolve(page, nodes) {
  let pts = [];
  for (const n of nodes) pts = pts.concat(pointsOf(n));
  for (const n of nodes) n.style.visibility = "hidden";
  if (pts.length > 9000) { const k = Math.ceil(pts.length / 9000); pts = pts.filter((_, i) => i % k === 0); }

  const w = innerWidth, h = innerHeight;
  const crowd = el("div", "dc-crowd"); crowd.setAttribute("aria-hidden", "true");
  /* a scattered, floating crowd: mostly small labels, some medium, a few large */
  const area = w * h, count = Math.max(40, Math.min(110, Math.round(area / 13000))), anchors = [];
  const cellsX = Math.max(3, Math.round(Math.sqrt(count * w / h))), cellsY = Math.ceil(count / cellsX);
  for (let i = 0; i < cellsX * cellsY; i++) {
    const r = Math.random(), fs = r < .68 ? 10 + Math.random() * 3 : r < .92 ? 15 + Math.random() * 8 : 27 + Math.random() * 16;
    const cx = (i % cellsX + Math.random()) / cellsX, cy = (Math.floor(i / cellsX) + Math.random()) / cellsY;
    const ax = cx * w - (fs > 20 ? fs * 4 : fs * 6), ay = 10 + cy * (h - 20);
    const s = el("span"); const dot = el("b", null, "● "); s.append(dot, workerLabel().slice(2));
    s.style.left = ax.toFixed(0) + "px"; s.style.top = ay.toFixed(0) + "px"; s.style.fontSize = fs.toFixed(1) + "px";
    s.style.setProperty("--op", (fs > 26 ? .22 + Math.random() * .1 : fs > 14 ? .45 + Math.random() * .15 : .7 + Math.random() * .2).toFixed(2)); if (fs > 26) s.style.zIndex = 0; else s.style.zIndex = fs > 14 ? 1 : 2;
    s.style.setProperty("--dx", ((Math.random() * 2 - 1) * (30 + fs * 2)).toFixed(0) + "px");
    s.style.setProperty("--dy", ((Math.random() * 2 - 1) * (14 + fs)).toFixed(0) + "px");
    const dur = 7 + Math.random() * 12; s.style.setProperty("--dur", dur.toFixed(1) + "s"); s.style.setProperty("--del", (-Math.random() * dur).toFixed(1) + "s");
    s.style.transitionDelay = (Math.random() * 1.6).toFixed(2) + "s"; crowd.appendChild(s);
    anchors.push([ax + fs * .35, ay + fs * .55]);
  }
  const cap = el("div", "dc-cap");
  cap.appendChild(el("p", null, "The voice was made of them."));
  const more = el("button", "dc-btn", "(Look closer)"); more.type = "button";
  cap.appendChild(more);

  if (reduce || !pts.length) {
    page.append(crowd, cap);
    crowd.querySelectorAll("span").forEach(s => s.classList.add("on"));
    crowd.classList.add("dim"); cap.classList.add("on");
  } else {
    const cv = el("canvas", "dc-dust"), dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = w * dpr; cv.height = h * dpr; page.append(cv, crowd, cap);
    const x = cv.getContext("2d"); x.scale(dpr, dpr);
    const P = pts.map((p, i) => {
      const t = anchors[i % anchors.length], ang = Math.random() * Math.PI * 2, rr = Math.random() * 2.5;
      return { x: p[0], y: p[1], vx: (Math.random() - .5) * 2.2, vy: (Math.random() - .5) * 2.2 - .4, c: p[2], tx: t[0] + Math.cos(ang) * rr, ty: t[1] + Math.sin(ang) * rr, s: 0, sx: 0, sy: 0 };
    });
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const t0 = performance.now(); let shown = false, captioned = false;
    await new Promise(done => {
      (function loop(now) {
        const t = now - t0;
        x.clearRect(0, 0, w, h);
        if (t < 800) { for (const p of P) { p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy *= .985; } }
        else {
          const k = ease(Math.min(1, (t - 800) / 2400));
          for (const p of P) { if (!p.s) { p.s = 1; p.sx = p.x; p.sy = p.y; } p.x = p.sx + (p.tx - p.sx) * k; p.y = p.sy + (p.ty - p.sy) * k; if (k > .85) p.c = "#2f6bff"; }
        }
        for (const p of P) { x.fillStyle = p.c; x.fillRect(p.x, p.y, 1.6, 1.6); }
        if (t > 2800 && !shown) { shown = true; crowd.querySelectorAll("span").forEach(s => s.classList.add("on")); cv.style.transition = "opacity 1.6s"; cv.style.opacity = "0"; }
        if (t > 4600 && !captioned) { captioned = true; crowd.classList.add("dim"); cap.classList.add("on"); done(); }
        if (t < 6000) requestAnimationFrame(loop);
      })(t0);
    });
  }
  more.focus({ preventScroll: true });
  await new Promise(r => more.addEventListener("click", r, { once: true }));
}

/* ------------------------------------------------------------------ step 2: the worker's screen */
function workerConsole(page, history) {
  page.innerHTML = "";
  const wrap = el("div", "dc-scroll"); page.appendChild(wrap);
  const con = el("div", "dc-con dc-fade");
  con.appendChild(el("p", "dc-meanwhile", "Meanwhile, somewhere else, your questions arrive in a queue."));
  const bar = el("div", "dc-bar");
  const wid = 10000 + Math.floor(Math.random() * 89999);
  let earned = 2.71, done = 0, tasksToday = 412;
  const earnEl = el("b", null, "$" + earned.toFixed(2)), countEl = el("b", null, String(tasksToday));
  const b1 = el("span"); b1.append("TaskHive · Worker #" + wid);
  const b2 = el("span"); b2.append("Tasks today: ", countEl);
  const b3 = el("span"); b3.append("Earned today: ", earnEl);
  bar.append(b1, b2, b3);
  const card = el("div", "dc-card");
  con.append(bar, card);
  wrap.appendChild(con);

  let timer = null;
  function render() {
    clearInterval(timer);
    card.innerHTML = "";
    if (done >= history.length) return finish();
    const h = history[done];
    const meta = el("div", "dc-meta");
    meta.appendChild(el("span", null, `Task ${done + 1} of ${history.length} · Rate the assistant's response · Reward $0.01`));
    const tm = el("span", "dc-timer", "00:45"); meta.appendChild(tm);
    let left = 45;
    timer = setInterval(() => { left = Math.max(0, left - 1); tm.textContent = "00:" + String(left).padStart(2, "0"); }, 1000);
    card.append(meta,
      el("div", "dc-lbl", "USER PROMPT"), el("div", "dc-box", h.q),
      el("div", "dc-lbl", "ASSISTANT RESPONSE"), el("div", "dc-box", h.a),
      el("div", "dc-rules", "Rate quickly. Accuracy below 95% or slow responses may lead to account suspension. Rejected tasks are not paid."));
    const acts = el("div", "dc-acts");
    for (const lab of ["Helpful", "Not helpful", "Make it sound more certain"]) {
      const b = el("button", null, lab); b.type = "button";
      b.addEventListener("click", () => { done++; tasksToday++; earned += .01; earnEl.textContent = "$" + earned.toFixed(2); countEl.textContent = String(tasksToday); render(); });
      acts.appendChild(b);
    }
    card.appendChild(acts);
    acts.firstChild.focus({ preventScroll: true });
  }
  async function finish() {
    card.appendChild(el("div", "dc-done", `Batch complete. +$${(history.length * .01).toFixed(2)}. Thank you for your contribution to intelligence. Next batch loading…`));
    await sleep(3200);
    statement(page);
  }
  render();
}

/* ------------------------------------------------------------------ step 3: the statement */
async function statement(page) {
  page.innerHTML = "";
  const wrap = el("div", "dc-scroll"); page.appendChild(wrap);
  const st = el("div", "dc-st"); wrap.appendChild(st);
  const ps = STATEMENT.map((t, i) => { const p = el("p", i === STATEMENT.length - 1 ? "last" : null, t); st.appendChild(p); return p; });
  const src = el("div", "dc-src");
  const again = el("button", "dc-btn", "(Return to the cathedral)"); again.type = "button";
  again.addEventListener("click", () => location.reload());
  const ev = el("button", "dc-btn", "(See the evidence)"); ev.type = "button";
  ev.addEventListener("click", () => evidence(page));
  src.append(ev, again);
  st.appendChild(src);
  for (const p of ps) { await sleep(300); p.classList.add("on"); await sleep(1900); }
  await sleep(600); src.classList.add("on");
}

/* ------------------------------------------------------------------ step 4: the evidence */
function evidence(page) {
  page.innerHTML = "";
  const wrap = el("div", "dc-scroll"); page.appendChild(wrap);
  const ev = el("div", "dc-ev dc-fade"); wrap.appendChild(ev);
  ev.appendChild(el("h2", null, "This is not fiction."));
  ev.appendChild(el("p", "dc-evlead", "Everything inside the cult is based on documented cases. Open any source to read the original reporting."));
  for (const g of EVIDENCE) {
    ev.appendChild(el("h3", null, g.group));
    ev.appendChild(el("p", "dc-glead", g.lead));
    const grid = el("div", "dc-grid");
    for (const c of g.cases) {
      const card = el("article", "dc-case");
      const m = el("div", "m"); const b = el("b", null, c.when); m.append(b, " · " + c.where);
      const a = el("a", null, "Source: " + c.src + " ↗"); a.href = c.url; a.target = "_blank"; a.rel = "noopener";
      card.append(m, el("h4", null, c.title), el("p", null, c.text), a);
      grid.appendChild(card);
    }
    ev.appendChild(grid);
  }
  const foot = el("div", "dc-foot");
  const back = el("button", "dc-btn", "(Back to the statement)"); back.type = "button"; back.addEventListener("click", () => statement(page));
  const again = el("button", "dc-btn", "(Return to the cathedral)"); again.type = "button"; again.addEventListener("click", () => location.reload());
  foot.append(back, again); ev.appendChild(foot);
  wrap.scrollTop = 0;
}
